# ============================================================
# Footy Tipping — Hourly Score Update
# Runs every hour Thursday to Monday (peak footy days)
# and every 6 hours Tuesday and Wednesday (off-peak)
# ============================================================

name: Update Tipping Scores

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run score calculator
        env:
          GITHUB_TOKEN: ${{ secrets.SCORING_TOKEN }}
        run: python scores.py
